name: Verify extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Extension Host smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
      - name: Extension Host smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:host
      - run: npm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: ai-project-designer-${{ runner.os }}
          path: ai-project-designer.vsix
